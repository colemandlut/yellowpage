<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow Page · 常用站点导航</title>
  <meta name="description" content="常用站点导航与免费额度速查 / Frequently used sites with free-tier reference">
  <meta name="theme-color" content="#07080d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ab7ff'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' font-family='-apple-system,Segoe UI,sans-serif' font-size='34' font-weight='800' fill='white' text-anchor='middle' dominant-baseline='middle'%3EY%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!--
    Google AdSense  ——  在 app.js 顶部 ADSENSE 配置好之后会由 JS 自动注入。
    如果你想直接在 HTML 里硬编码（更早加载），把下行取消注释并替换 ca-pub-XXXX：
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  -->
</head>
<body>
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top">
        <span class="brand-mark">▍</span>
        <span class="brand-name" data-i18n="brand">Yellow Page</span>
      </a>
      <div class="topbar-tools">
        <div class="search">
          <input type="search" id="search" data-i18n-attr="placeholder|search_placeholder" autocomplete="off" spellcheck="false">
        </div>
        <select id="lang-switch" class="select-pill" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" type="button">🌙</button>
      </div>
    </div>
  </header>

  <main class="shell" id="top">
    <aside class="ad-rail ad-rail-left" aria-label="Advertisement">
      <div class="ad-placeholder">
        <span class="ad-placeholder-title">Ad Slot</span>
        <small>160 × 600</small>
        <small class="hint" data-i18n="ad_hint">在 app.js 中设置 ADSENSE.enabled = true 启用</small>
      </div>
    </aside>

    <div class="content">
      <section class="hero">
        <h1 data-i18n="hero_title">我的常用站点</h1>
        <p data-i18n="hero_subtitle">常用站点速查 · 含免费额度信息</p>
      </section>

      <section id="grid" class="grid"></section>

      <p id="empty" class="empty" hidden data-i18n="empty">没有匹配的站点</p>
    </div>

    <aside class="ad-rail ad-rail-right" aria-label="Advertisement">
      <div class="ad-placeholder">
        <span class="ad-placeholder-title">Ad Slot</span>
        <small>160 × 600</small>
        <small class="hint" data-i18n="ad_hint">在 app.js 中设置 ADSENSE.enabled = true 启用</small>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span data-i18n="footer">由 Cloudflare Pages 托管</span>
    <span class="dot">·</span>
    <span><span id="site-count">0</span> <span data-i18n="sites_label">个站点</span></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
